<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jivaansh Yadav">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="assets/img/404.png" title="404">
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #343a40;
            margin: 0;
            padding: 0;
        }

        .container {
            position: relative;
        }

        h1 {
            font-size: 100px;
            color: #dc3545;
        }

        h2 {
            font-size: 24px;
        }

        p {
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .icon {
            font-size: 100px;
            color: #17a2b8;
        }

        .contact {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <i class="fas fa-exclamation-triangle icon"></i>
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <p><strong>Possible reasons:</strong></p>
        <ul style="list-style:none;">
            <li>🔍 Incorrect URL</li>
            <li>🔄 Page has been removed</li>
            <li>🔗 Broken link</li>
        </ul>
        <a href="/" class="btn">Return to Home</a>
        <p class="contact">Need help? <a href="mailto:jivaanshyadav@gmail.com">Contact Us</a></p>
    </div>
</body>
</html>
